spring:
  application:
    name: bff-service

  datasource:
    url: jdbc:mysql://localhost:3306/gwent?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

# Configuracion de servicios internos
gwent:
  security:
    jwt:
      jwks-uri: http://localhost:8085/.well-known/jwks.json
  services:
    bff:
      v1-version: "api/v1/auth"
      register: "/register"
      login: "/login"

    jugador:
      name: "jugador-service"
      base-url: "http://localhost:8082/api"
      v1-version: "/v1"
      me-url: "/me"
      create-player-url: "/v1/players"
    ingame:
      base-url: "http://localhost:8083"
    auth:
      name: "auth-service"
      v1-version: "/v1"
      base-url: "http://localhost:8085/auth"
      register: "/register"
      login: "/login"


logging:
  level:
    org.springframework.security: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never